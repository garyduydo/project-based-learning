<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <!-- Navigation -->
     <nav>
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
      <button class="themebtn">Dark Mode</a>
     </nav>

    <!-- Header Section -->
    <header>
    <h1 class="my_name">Gary Do</h1>
    <p class="typing-text"></p>
    <a href="#contact" class="btn">Get In Touch</a>
    </header>

    <!-- About Section -->
     <section id="about">
      <h2>
        About Me
      </h2>
      <p> I'm a passionate learner on a journey to become a full stack Engineer. Right now I am learning HTML/CSS</p>
     </section>

     <!-- Skills Section -->
      <section id="skills">
      <h2>Skills</h2>
      <div class="skills"></div>
        <p> HTML </p>
        <div class="progress-bar">
          <div class="progress" data-width="60"></div>
        </div>
      <div>
      <div class="skills"></div>
        <p> CSS </p>
        <div class="progress-bar">
          <div class="progress" data-width="50"></div>
        </div>
      <div>
      <div class="skills"></div>
        <p> Javascript </p>
        <div class="progress-bar">
          <div class="progress" data-width="10"></div>
        </div>
      <div>
      </section>

      <!-- Projects Section -->
       <section id="projects">
       <h2>
        Projects
       </h2>
       <p> Coming soon !!!</p>
       </section>

      <!-- Contact Section -->
       <section id="contact">
        <h2>Contact Me</h2>
        <form class="contact-form">
          <input type="text" placeholder="Gary Do" class="form-input" id="name">
          <input type="email" placeholder="garydo050915@gmail.com" class="form-input" id="email">
          <textarea placeholder="Hi There!" class="form-input" id="message"></textarea>
          <button type="submit" class="btn">Send Message</button>
        </form>
       </section>

      <script src="script.js"></script>

  </body>


</html>
